# デフォルトブランチに反映されるたびに、単体で開ける shift.html をビルドして GitHub Pages に公開する
name: Pages

on:
  push:
    branches: [claude/relaxed-cerf-48i084]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テストとビルド
        run: |
          npm test
          npm run build
          mkdir _site
          cp dist/shift.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
