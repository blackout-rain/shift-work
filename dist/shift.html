<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト自動作成</title>
<style>
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunken:#E8ECE7; --ink:#16262A; --muted:#5A6A6C; --line:#D3DAD4;
  --accent:#0C7A64; --accent-soft:#D5EDE5; --accent-ink:#06483B;
  --req:#C9503A; --req-soft:#F8DDD6;
  --warn:#B86A00; --warn-soft:#FBE8C6;
  --bad:#B3261E; --bad-soft:#F9DEDC;
  --sat:#2F6FB3; --sun:#C9503A;
  --shadow:0 1px 0 rgba(22,38,42,.04),0 8px 24px -12px rgba(22,38,42,.18);
  --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A1C; --surface:#152427; --sunken:#0B1618; --ink:#E5EEEB; --muted:#92A5A6; --line:#294044;
  --accent:#3FC0A2; --accent-soft:#16382F; --accent-ink:#A8EBD9;
  --req:#F08A74; --req-soft:#432620;
  --warn:#EDA94A; --warn-soft:#42300F;
  --bad:#F2918B; --bad-soft:#4A2321;
  --sat:#7DB2EA; --sun:#F08A74;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1C; --surface:#152427; --sunken:#0B1618; --ink:#E5EEEB; --muted:#92A5A6; --line:#294044;
  --accent:#3FC0A2; --accent-soft:#16382F; --accent-ink:#A8EBD9;
  --req:#F08A74; --req-soft:#432620;
  --warn:#EDA94A; --warn-soft:#42300F;
  --bad:#F2918B; --bad-soft:#4A2321;
  --sat:#7DB2EA; --sun:#F08A74;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
h1{font-size:20px;margin:0;font-weight:700}
.month{display:flex;align-items:center;gap:8px;font-size:17px}
.month strong{min-width:7.5em;text-align:center;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-weight:500;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.icon{width:34px;padding:4px 0;font-size:18px;line-height:1}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}

.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px}
.banner.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner b{font-weight:700}

.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.g th,.g td{height:34px;min-width:30px;padding:0 2px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.g thead th{background:var(--sunken);font-weight:500;color:var(--muted);line-height:1.25;height:44px;padding:0}
.g thead th.n,.g td.n,.g tfoot th{position:sticky;left:0;z-index:1;text-align:left;min-width:104px;padding-left:10px;background:var(--surface)}
.g thead th.n{background:var(--sunken);z-index:2}
.g td.n span{font-size:11px;color:var(--muted);margin-left:5px}
.dayBtn{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;padding:4px 0;cursor:pointer}
.dayBtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.g th.sat{color:var(--sat)} .g th.sun{color:var(--sun)}
.g th.hi{box-shadow:inset 0 3px 0 var(--req)}
.g td.cell{cursor:pointer;user-select:none}
.g td.cell:hover{background:var(--sunken)}
.g td.w{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.g td.r{background:var(--req-soft);color:var(--req);font-weight:700}
.g td.v{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}
.g td.cnt{color:var(--muted);min-width:44px;border-right:0}
.g thead th.cnt{border-right:0}
.g tfoot th,.g tfoot td{background:var(--sunken);font-weight:700}
.g tfoot tr.needRow td{padding:0}
.needIn{width:100%;min-width:30px;height:32px;border:0;background:transparent;text-align:center;font-weight:700;padding:0;-moz-appearance:textfield}
.needIn::-webkit-outer-spin-button,.needIn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.needIn.ov{color:var(--warn)}
.g td.ok{color:var(--accent)}
.g td.ng{background:var(--warn-soft);color:var(--warn)}
.prt{display:none}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .hint{flex:1 1 280px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.w{background:var(--accent-soft);border:1px solid var(--accent)}
.sw.r{background:var(--req-soft);border:1px solid var(--req)}
.sw.v{border:2px solid var(--bad)}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
summary{font-weight:700;cursor:pointer}
details[open] summary{margin-bottom:10px}
.fields{display:flex;flex-wrap:wrap;gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields input,.staff-row input,.staff-row select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;min-width:0}
.fields input{width:9em;font-size:15px}
.staff-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.staff-row{display:grid;grid-template-columns:minmax(5em,1fr) 4.5em 7em auto;gap:6px;align-items:center}
.staff-head{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.staff-row .btn{padding:4px 10px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot .note{margin:0}

@media (max-width:520px){
  .actions{margin-left:0}
  .staff-row{grid-template-columns:minmax(4em,1fr) 4em 6.5em auto}
}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;padding:0}
  .top .actions,.banner,.legend,.settings,#prevMonth,#nextMonth,tfoot,.cnt{display:none!important}
  .top{margin-bottom:8px}
  .board{border:0;box-shadow:none}
  .g th,.g td{border-color:#999;height:26px;color:#000!important;box-shadow:none!important}
  .g thead th{background:#eee!important}
  .g thead th.n,.g td.n{position:static;background:#fff!important}
  .g td.w{background:#fff!important;font-weight:700}
  .g td.r{background:#f0f0f0!important}
  .g th.hi{box-shadow:none!important;background:#f6e7e3!important}
  .scr{display:none}
  .prt{display:inline}
  .g td.n span{display:none}
}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:10;max-width:90vw}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}

.wide{grid-column:1/-1}
.off-rows{display:flex;flex-direction:column;gap:8px}
.off-row{display:grid;grid-template-columns:7.5em repeat(3,minmax(0,12em));gap:8px;align-items:center}
.off-row .who{font-weight:500}
.off-row .who span{font-size:11.5px;color:var(--muted);margin-left:5px}
.off-row select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
.off-row select.set{background:var(--req-soft);border-color:var(--req);color:var(--req);font-weight:700}
.off-row .more{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-4px}
@media (max-width:640px){
  .off-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .off-row .who{grid-column:1/-1}
  .off-row .more{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>シフト自動作成</h1>
    <div class="month">
      <button class="btn icon" id="prevMonth" aria-label="前の月">‹</button>
      <strong id="monthLabel"></strong>
      <button class="btn icon" id="nextMonth" aria-label="次の月">›</button>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="入力モード">
        <button class="on" id="modeOff" aria-pressed="true">希望休を入れる</button>
        <button id="modeWork" aria-pressed="false">出勤を直す</button>
      </div>
      <button class="btn main" id="solveBtn">自動作成</button>
      <button class="btn" id="csvBtn">CSV</button>
      <button class="btn" id="printBtn">印刷</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status"></div>

  <section class="board" aria-label="シフト表">
    <div class="scroll" id="grid"></div>
    <div class="legend">
      <span><i class="sw w"></i>出勤</span>
      <span><i class="sw r"></i>希望休</span>
      <span><i class="sw v"></i>3連勤</span>
      <span class="hint">日付をタップすると「土日祝など高め」と「通常」を切り替えます。必要ptの数字は直接書き換えられます。</span>
    </div>
  </section>

  <section class="settings">
    <details open class="wide">
      <summary>希望休の入力（<span id="offMonth"></span>）</summary>
      <div id="offRows" class="off-rows"></div>
      <p class="note">ここでは1人3日まで選べます。選ぶとシフト表の「希」に反映されます。4日以上は、シフト表のセルをタップして入れてください。</p>
    </details>
    <details open>
      <summary>必要ポイント</summary>
      <div class="fields">
        <label>平日<input type="number" id="needWeekday" min="0" max="99"></label>
        <label>土日祝など高めの日<input type="number" id="needHigh" min="0" max="99"></label>
      </div>
    </details>
    <details open>
      <summary>スタッフと戦力ポイント</summary>
      <div id="staffList" class="staff-list"></div>
      <button class="btn" id="addStaff">スタッフを追加</button>
      <p class="note">「前月末の連勤」は、月の初めの時点で何日続けて出勤していたかです。2日なら1日は必ず休みになります。</p>
    </details>
    <div class="foot">
      <button class="btn danger" id="resetBtn">すべて初期状態に戻す</button>
      <span class="note">入力内容はこのブラウザにだけ保存されます。</span>
    </div>
  </section>
</div>
<script>
/*
 * シフト自動作成の計算部分（ブラウザでも Node でも動く）
 *
 * 条件
 *   - 毎日、出勤者の戦力ポイント合計が必要ポイント以上
 *   - 希望休の日は出勤しない
 *   - 3日連続では出勤しない（2連勤まで）
 *
 * 「何連勤しているか」(0/1/2) を人数分まとめた状態を使い、
 * 最後の日まで条件を満たせるかを厳密に調べる。条件を満たす表が
 * 存在すれば必ず見つかり、存在しなければ最初に破綻する日を返す。
 * 満たす表の中から、余剰ポイントと出勤日数の偏りが小さいものを選ぶ。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ShiftSolver = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const MAX_STAFF = 12;
  const MAX_RUN = 2; // 連続で働ける日数の上限

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /**
   * input: {
   *   points:     number[n]        スタッフごとの戦力ポイント
   *   need:       number[D]        日ごとの必要ポイント
   *   high:       boolean[D]       土日祝など高め設定の日（偏りの計算に使う）
   *   off:        boolean[n][D]    希望休
   *   prevStreak: number[n]        月初の時点で何日連続で出勤中か（0〜2）
   * }
   * 戻り値: { ok:true, rows:number[n][D], cost } または { ok:false, conflict }
   */
  function solve(input, options) {
    const opts = Object.assign({ tries: 40, starts: 4, iters: 150000, seed: 1 }, options);
    const { points, need } = input;
    const n = points.length;
    const D = need.length;
    if (n === 0 || D === 0) return { ok: false, conflict: { reason: 'empty' } };
    if (n > MAX_STAFF) throw new Error('スタッフは' + MAX_STAFF + '人までです');

    const off = input.off || points.map(() => new Array(D).fill(false));
    const high = input.high || need.map(() => false);
    const prev = input.prevStreak || points.map(() => 0);
    const pow3 = [1];
    for (let i = 1; i <= n; i++) pow3.push(pow3[i - 1] * 3);
    const S = pow3[n];

    const psum = new Int32Array(1 << n);
    for (let m = 1; m < 1 << n; m++) {
      const low = m & -m;
      psum[m] = psum[m ^ low] + points[31 - Math.clz32(low)];
    }

    const digit = (st, i) => Math.floor(st / pow3[i]) % 3;
    const allowedMask = (d, st) => {
      let m = 0;
      for (let i = 0; i < n; i++) if (digit(st, i) < MAX_RUN && !off[i][d]) m |= 1 << i;
      return m;
    };
    const nextState = (st, sub) => {
      let r = 0;
      for (let i = 0; i < n; i++) if (sub & (1 << i)) r += (digit(st, i) + 1) * pow3[i];
      return r;
    };

    let init = 0;
    for (let i = 0; i < n; i++) init += Math.min(MAX_RUN, Math.max(0, prev[i] | 0)) * pow3[i];

    // minSurplus(d, st): d日目以降を条件どおり組んだときの余剰ポイント合計の最小値（組めなければ INF）
    const INF = 1e9;
    const memo = new Int32Array((D + 1) * S).fill(-1);
    function minSurplus(d, st) {
      if (d === D) return 0;
      const k = d * S + st;
      if (memo[k] >= 0) return memo[k];
      const allowed = allowedMask(d, st);
      let best = INF;
      for (let sub = allowed; ; sub = (sub - 1) & allowed) {
        if (psum[sub] >= need[d]) {
          const rest = minSurplus(d + 1, nextState(st, sub));
          if (rest < INF) best = Math.min(best, psum[sub] - need[d] + rest);
        }
        if (sub === 0) break;
      }
      memo[k] = best;
      return best;
    }
    const feasible = (d, st) => minSurplus(d, st) < INF;

    if (!feasible(0, init)) return { ok: false, conflict: diagnose() };

    function diagnose() {
      let reach = new Set([init]);
      for (let d = 0; d < D; d++) {
        const next = new Set();
        let maxPossible = 0;
        for (const st of reach) {
          const allowed = allowedMask(d, st);
          maxPossible = Math.max(maxPossible, psum[allowed]);
          for (let sub = allowed; ; sub = (sub - 1) & allowed) {
            if (psum[sub] >= need[d]) next.add(nextState(st, sub));
            if (sub === 0) break;
          }
        }
        if (next.size === 0) {
          const offStaff = [];
          for (let i = 0; i < n; i++) if (off[i][d]) offStaff.push(i);
          return { reason: 'short', day: d, need: need[d], maxPossible, offStaff };
        }
        reach = next;
      }
      return { reason: 'unknown' };
    }

    const fairness = (arr) => {
      let mx = -Infinity;
      let mn = Infinity;
      let sum = 0;
      for (const v of arr) {
        if (v > mx) mx = v;
        if (v < mn) mn = v;
        sum += v;
      }
      const mean = sum / arr.length;
      let ss = 0;
      for (const v of arr) ss += (v - mean) * (v - mean);
      return 2 * (mx - mn) + ss;
    };
    // 余剰ポイントを最優先し、出勤日数と土日祝出勤の偏りを小さくする
    const costOf = (surplus, work, hi) => 10 * surplus + 3 * fairness(work) + 3 * fairness(hi);

    function build(rng, noise) {
      let st = init;
      const rows = points.map(() => new Array(D).fill(0));
      const work = new Array(n).fill(0);
      const hiWork = new Array(n).fill(0);
      let surplus = 0;
      for (let d = 0; d < D; d++) {
        const allowed = allowedMask(d, st);
        const mean = work.reduce((a, b) => a + b, 0) / n;
        const hiMean = hiWork.reduce((a, b) => a + b, 0) / n;
        let best = -1;
        let bestScore = Infinity;
        for (let sub = allowed; ; sub = (sub - 1) & allowed) {
          if (psum[sub] >= need[d] && feasible(d + 1, nextState(st, sub))) {
            let score = 10 * (psum[sub] - need[d] + minSurplus(d + 1, nextState(st, sub))) + rng() * noise;
            for (let i = 0; i < n; i++) {
              if (sub & (1 << i)) {
                score += 2 * (work[i] - mean);
                if (high[d]) score += 2 * (hiWork[i] - hiMean);
              }
            }
            if (score < bestScore) {
              bestScore = score;
              best = sub;
            }
          }
          if (sub === 0) break;
        }
        surplus += psum[best] - need[d];
        for (let i = 0; i < n; i++) {
          if (best & (1 << i)) {
            rows[i][d] = 1;
            work[i]++;
            if (high[d]) hiWork[i]++;
          }
        }
        st = nextState(st, best);
      }
      return { rows, surplus, cost: costOf(surplus, work, hiWork) };
    }

    /*
     * 条件を保ったまま少しずつ入れ替えて、出勤日数と土日祝の出勤の偏りを減らす。
     * 変更のたびに「必要ポイント」「希望休」「3連勤」を確かめ、破るものは取り消す。
     */
    function anneal(start, rng, iters) {
      const rows = start.rows.map((r) => r.slice());
      const tot = new Int32Array(D);
      const work = new Array(n).fill(0);
      const hi = new Array(n).fill(0);
      let surplus = 0;
      for (let i = 0; i < n; i++)
        for (let d = 0; d < D; d++)
          if (rows[i][d]) {
            tot[d] += points[i];
            work[i]++;
            if (high[d]) hi[i]++;
          }
      for (let d = 0; d < D; d++) surplus += tot[d] - need[d];

      const setCell = (i, d, v) => {
        if (rows[i][d] === v) return;
        const sign = v ? 1 : -1;
        rows[i][d] = v;
        tot[d] += sign * points[i];
        surplus += sign * points[i];
        work[i] += sign;
        if (high[d]) hi[i] += sign;
      };
      const lineOk = (i) => {
        let run = Math.min(MAX_RUN, Math.max(0, prev[i] | 0));
        const r = rows[i];
        for (let d = 0; d < D; d++) {
          if (r[d]) {
            if (off[i][d] || ++run > MAX_RUN) return false;
          } else run = 0;
        }
        return true;
      };
      const ri = (k) => Math.floor(rng() * k);

      let cost = costOf(surplus, work, hi);
      let bestCost = cost;
      let bestRows = rows.map((r) => r.slice());
      const T0 = 8;
      const T1 = 0.2;
      for (let it = 0; it < iters; it++) {
        const T = T0 * Math.pow(T1 / T0, it / iters);
        const kind = rng();
        let ops;
        if (kind < 0.45) {
          // 同じ日の担当を入れ替える
          const d = ri(D), i = ri(n), j = ri(n);
          if (rows[i][d] !== 1 || rows[j][d] !== 0) continue;
          ops = [[i, d, 0], [j, d, 1]];
        } else if (kind < 0.85) {
          // 同じ人の出勤日を動かす
          const i = ri(n), d1 = ri(D), d2 = ri(D);
          if (rows[i][d1] !== 1 || rows[i][d2] !== 0) continue;
          ops = [[i, d1, 0], [i, d2, 1]];
        } else {
          // 2人の出勤日を入れ替える
          const i = ri(n), j = ri(n), d1 = ri(D), d2 = ri(D);
          if (i === j || rows[i][d1] !== 1 || rows[i][d2] !== 0 || rows[j][d1] !== 0 || rows[j][d2] !== 1) continue;
          ops = [[i, d1, 0], [j, d1, 1], [i, d2, 1], [j, d2, 0]];
        }
        const old = ops.map(([i, d]) => rows[i][d]);
        ops.forEach(([i, d, v]) => setCell(i, d, v));
        let valid = true;
        for (const [i, d] of ops) {
          if (tot[d] < need[d] || !lineOk(i)) { valid = false; break; }
        }
        let next = cost;
        if (valid) {
          next = costOf(surplus, work, hi);
          valid = next <= cost || rng() < Math.exp((cost - next) / T);
        }
        if (!valid) {
          for (let k = ops.length - 1; k >= 0; k--) setCell(ops[k][0], ops[k][1], old[k]);
          continue;
        }
        cost = next;
        if (cost < bestCost) {
          bestCost = cost;
          bestRows = rows.map((r) => r.slice());
        }
      }
      let bestSurplus = 0;
      for (let d = 0; d < D; d++) {
        let t = 0;
        for (let i = 0; i < n; i++) if (bestRows[i][d]) t += points[i];
        bestSurplus += t - need[d];
      }
      return { rows: bestRows, cost: bestCost, surplus: bestSurplus };
    }

    const rng = mulberry32(opts.seed);
    const pool = [];
    for (let t = 0; t < opts.tries; t++) pool.push(build(rng, 2 + rng() * 14));
    pool.sort((a, b) => a.cost - b.cost);
    let best = pool[0];
    for (let k = 0; k < Math.min(opts.starts, pool.length); k++) {
      const cand = anneal(pool[k], rng, opts.iters);
      if (cand.cost < best.cost) best = cand;
    }
    return { ok: true, rows: best.rows, cost: best.cost, surplus: best.surplus, optimalSurplus: minSurplus(0, init) };
  }

  /**
   * 出来上がった（または手で直した）表が条件を満たしているか調べる。
   * rows: number[n][D]（1=出勤）
   */
  function check(input, rows) {
    const { points, need } = input;
    const n = points.length;
    const D = need.length;
    const off = input.off || points.map(() => new Array(D).fill(false));
    const prev = input.prevStreak || points.map(() => 0);

    const total = [];
    const diff = [];
    for (let d = 0; d < D; d++) {
      let t = 0;
      for (let i = 0; i < n; i++) if (rows[i] && rows[i][d]) t += points[i];
      total.push(t);
      diff.push(t - need[d]);
    }

    const runCells = new Set(); // "i,d" 3連勤に含まれるセル
    for (let i = 0; i < n; i++) {
      const line = new Array(Math.min(MAX_RUN, Math.max(0, prev[i] | 0))).fill(1);
      const offset = line.length;
      for (let d = 0; d < D; d++) line.push(rows[i] && rows[i][d] ? 1 : 0);
      let run = 0;
      for (let k = 0; k < line.length; k++) {
        run = line[k] ? run + 1 : 0;
        if (run > MAX_RUN) {
          for (let b = 0; b <= MAX_RUN; b++) {
            const d = k - b - offset;
            if (d >= 0) runCells.add(i + ',' + d);
          }
        }
      }
    }

    const offCells = new Set(); // 希望休なのに出勤になっているセル
    for (let i = 0; i < n; i++)
      for (let d = 0; d < D; d++) if (off[i][d] && rows[i] && rows[i][d]) offCells.add(i + ',' + d);

    const shortDays = diff.filter((v) => v < 0).length;
    return { total, diff, runCells, offCells, shortDays };
  }

  return { solve, check, MAX_STAFF, MAX_RUN };
});
</script>
<script>
(function () {
  'use strict';

  const KEY = 'shift-work-v1';
  const MAX_UI_STAFF = 10;
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const $ = (id) => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const pad = (n) => String(n).padStart(2, '0');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- 保存データ ---------- */
  function defaults() {
    return {
      staff: [['佐藤', 3], ['鈴木', 3], ['田中', 2], ['高橋', 2], ['伊藤', 2], ['渡辺', 1], ['山本', 1]].map(([name, points]) => ({ id: uid(), name, points, prevStreak: 0 })),
      needWeekday: 7,
      needHigh: 9,
      months: {},
    };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.staff) && s.months) return s;
    } catch (e) { /* 保存データが無い・壊れている場合は初期状態で始める */ }
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 保存できなくても動作は続ける */ }
  }

  let state = load();
  const firstRun = !state;
  if (!state) state = defaults();

  // 公開ページなど、ダウンロードや印刷が使えない環境か
  const sandboxed = typeof window.claude !== 'undefined';
  function toast(text) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  const now = new Date();
  const ui = { year: now.getFullYear(), month: now.getMonth(), mode: 'off', msg: null };

  const monthKey = () => ui.year + '-' + pad(ui.month + 1);
  const dayCount = () => new Date(ui.year, ui.month + 1, 0).getDate();
  const weekday = (day) => new Date(ui.year, ui.month, day).getDay();
  function md() {
    const k = monthKey();
    if (!state.months[k]) state.months[k] = { off: {}, shifts: null, dayType: {}, needOv: {} };
    return state.months[k];
  }

  /* ---------- 日ごとの設定 ---------- */
  function isHigh(day) {
    const t = md().dayType[day];
    if (t) return t === 'high';
    const w = weekday(day);
    return w === 0 || w === 6;
  }
  const defaultNeed = (day) => (isHigh(day) ? state.needHigh : state.needWeekday);
  function needOf(day) {
    const o = md().needOv[day];
    return o === undefined ? defaultNeed(day) : o;
  }

  /* ---------- 計算エンジンとの受け渡し ---------- */
  function buildInput() {
    const D = dayCount();
    const m = md();
    const days = Array.from({ length: D }, (_, i) => i + 1);
    return {
      points: state.staff.map((s) => s.points),
      need: days.map(needOf),
      high: days.map(isHigh),
      off: state.staff.map((s) => days.map((d) => !!(m.off[s.id] && m.off[s.id][d]))),
      prevStreak: state.staff.map((s) => s.prevStreak || 0),
    };
  }
  function currentRows() {
    const m = md();
    const D = dayCount();
    return state.staff.map((s) => Array.from({ length: D }, (_, i) => (m.shifts && m.shifts[s.id] && m.shifts[s.id][i]) || 0));
  }
  function setRows(rows) {
    const m = md();
    m.shifts = {};
    state.staff.forEach((s, i) => { m.shifts[s.id] = rows[i].slice(); });
  }

  /* ---------- 描画 ---------- */
  function renderGrid() {
    const D = dayCount();
    const m = md();
    const input = buildInput();
    const made = !!m.shifts;
    const rows = currentRows();
    const res = ShiftSolver.check(input, rows);

    let h = '<table class="g"><thead><tr><th class="n">スタッフ</th>';
    for (let d = 1; d <= D; d++) {
      const w = weekday(d);
      const cls = (w === 6 ? 'sat ' : w === 0 ? 'sun ' : '') + (isHigh(d) ? 'hi' : '');
      h += '<th class="' + cls + '"><button class="dayBtn" data-d="' + d + '" title="高め／通常を切り替え">' + d + '<br>' + WD[w] + '</button></th>';
    }
    h += '<th class="cnt">出勤</th></tr></thead><tbody>';
    state.staff.forEach((s, i) => {
      let cnt = 0;
      h += '<tr><td class="n">' + esc(s.name) + '<span>' + s.points + 'pt</span></td>';
      for (let d = 1; d <= D; d++) {
        const isOff = input.off[i][d - 1];
        const works = rows[i][d - 1] === 1;
        if (works) cnt++;
        const bad = res.runCells.has(i + ',' + (d - 1)) || res.offCells.has(i + ',' + (d - 1));
        const cls = 'cell ' + (isOff ? 'r' : works ? 'w' : '') + (bad ? ' v' : '');
        const body = isOff ? '<span class="scr">希</span><span class="prt">休</span>'
          : works ? '出' : '<span class="prt">休</span>';
        h += '<td class="' + cls + '" data-i="' + i + '" data-d="' + d + '">' + body + '</td>';
      }
      h += '<td class="cnt">' + (made ? cnt + '日' : '–') + '</td></tr>';
    });
    h += '</tbody><tfoot><tr class="needRow"><th>必要pt</th>';
    for (let d = 1; d <= D; d++) {
      const ov = m.needOv[d] !== undefined;
      h += '<td><input class="needIn' + (ov ? ' ov' : '') + '" type="number" min="0" max="99" data-d="' + d + '" value="' + needOf(d) + '" aria-label="' + d + '日の必要ポイント"></td>';
    }
    h += '<td></td></tr><tr><th>合計pt</th>';
    for (let d = 0; d < D; d++) h += '<td>' + (made ? res.total[d] : '–') + '</td>';
    h += '<td></td></tr><tr><th>判定</th>';
    for (let d = 0; d < D; d++) {
      if (!made) h += '<td>–</td>';
      else h += res.diff[d] >= 0 ? '<td class="ok">OK</td>' : '<td class="ng">' + res.diff[d] + '</td>';
    }
    h += '<td></td></tr></tfoot></table>';
    $('grid').innerHTML = h;
    renderBanner(res, made);
    renderOffForm();
  }

  function renderBanner(res, made) {
    const b = $('banner');
    if (ui.msg) {
      b.className = 'banner ' + ui.msg.kind;
      b.innerHTML = ui.msg.html;
      return;
    }
    if (!made) {
      b.className = 'banner';
      b.innerHTML = '希望休のセルをタップして入れ、「自動作成」を押してください。';
      return;
    }
    const surplus = res.diff.reduce((a, v) => a + Math.max(v, 0), 0);
    const parts = [];
    if (res.shortDays) parts.push('<span><b>' + res.shortDays + '日</b>で必要ポイントが足りません</span>');
    if (res.runCells.size) parts.push('<span>3連勤になっているセルが<b>' + res.runCells.size + '個</b>あります</span>');
    if (res.offCells.size) parts.push('<span>希望休なのに出勤のセルが<b>' + res.offCells.size + '個</b>あります</span>');
    if (parts.length) {
      b.className = 'banner warn';
      b.innerHTML = parts.join('');
    } else {
      b.className = 'banner ok';
      b.innerHTML = '<span><b>すべての条件を満たしています。</b>余剰ポイントは月合計で' + surplus + 'ptです。</span>';
    }
  }

  const OFF_SLOTS = 3;
  let offSig = '';
  function renderOffForm() {
    const D = dayCount();
    const sig = monthKey() + '|' + state.staff.map((s) => s.id + s.name + s.points).join(',');
    const wrap = $('offRows');
    if (sig !== offSig) {
      offSig = sig;
      const opts = ['<option value="">—</option>'];
      for (let d = 1; d <= D; d++) opts.push('<option value="' + d + '">' + (ui.month + 1) + '/' + d + '（' + WD[weekday(d)] + '）</option>');
      wrap.innerHTML = state.staff.map((s) =>
        '<div class="off-row" data-id="' + s.id + '"><div class="who">' + esc(s.name) + '<span>' + s.points + 'pt</span></div>' +
        Array.from({ length: OFF_SLOTS }, (_, k) => '<select data-slot="' + k + '" aria-label="' + esc(s.name) + 'の希望休' + (k + 1) + '">' + opts.join('') + '</select>').join('') +
        '<div class="more" hidden></div></div>').join('');
    }
    wrap.querySelectorAll('.off-row').forEach((row) => {
      const days = offDays(row.dataset.id);
      row.querySelectorAll('select').forEach((sel, k) => {
        sel.value = days[k] ? String(days[k]) : '';
        sel.classList.toggle('set', !!days[k]);
      });
      const more = row.querySelector('.more');
      more.hidden = days.length <= OFF_SLOTS;
      more.textContent = 'ほか' + (days.length - OFF_SLOTS) + '日分はシフト表で入力されています（' + days.slice(OFF_SLOTS).map((d) => (ui.month + 1) + '/' + d).join('、') + '）';
    });
    $('offMonth').textContent = (ui.month + 1) + '月';
  }

  function renderMonth() {
    $('monthLabel').textContent = ui.year + '年' + (ui.month + 1) + '月';
  }

  function renderSettings() {
    $('needWeekday').value = state.needWeekday;
    $('needHigh').value = state.needHigh;
    let h = '<div class="staff-row staff-head"><span>名前</span><span>pt</span><span>前月末の連勤</span><span></span></div>';
    state.staff.forEach((s) => {
      h += '<div class="staff-row" data-id="' + s.id + '">' +
        '<input data-f="name" value="' + esc(s.name) + '" aria-label="名前" maxlength="8">' +
        '<input data-f="points" type="number" min="1" max="9" value="' + s.points + '" aria-label="戦力ポイント">' +
        '<select data-f="prevStreak" aria-label="前月末の連勤">' +
        [0, 1, 2].map((v) => '<option value="' + v + '"' + (s.prevStreak === v ? ' selected' : '') + '>' + v + '日</option>').join('') +
        '</select><button class="btn" data-del="' + s.id + '" aria-label="' + esc(s.name) + 'を削除">削除</button></div>';
    });
    $('staffList').innerHTML = h;
    $('addStaff').disabled = state.staff.length >= MAX_UI_STAFF;
  }

  function renderAll() {
    renderMonth();
    renderGrid();
  }
  function changed() {
    ui.msg = null;
    save();
    renderGrid();
  }

  /* ---------- 操作 ---------- */
  function setOff(id, d, on) {
    const m = md();
    m.off[id] = m.off[id] || {};
    if (on) {
      m.off[id][d] = 1;
      if (m.shifts && m.shifts[id]) m.shifts[id][d - 1] = 0;
    } else delete m.off[id][d];
  }
  const offDays = (id) => Object.keys(md().off[id] || {}).map(Number).sort((x, y) => x - y);

  function toggleCell(i, d) {
    const s = state.staff[i];
    const m = md();
    if (ui.mode === 'off') {
      setOff(s.id, d, !(m.off[s.id] && m.off[s.id][d]));
    } else {
      if (m.off[s.id] && m.off[s.id][d]) return;
      if (!m.shifts) setRows(currentRows());
      if (!m.shifts[s.id]) m.shifts[s.id] = new Array(dayCount()).fill(0);
      m.shifts[s.id][d - 1] = m.shifts[s.id][d - 1] ? 0 : 1;
    }
    changed();
  }

  function solve() {
    const input = buildInput();
    const r = ShiftSolver.solve(input, { tries: 300, seed: Math.floor(Math.random() * 1e6) });
    if (r.ok) {
      setRows(r.rows);
      ui.msg = null;
      save();
      renderGrid();
      return;
    }
    const c = r.conflict;
    let html;
    if (c.reason === 'short') {
      const day = c.day + 1;
      const who = c.offStaff.map((i) => state.staff[i].name);
      html = '<span><b>' + (ui.month + 1) + '/' + day + '（' + WD[weekday(day)] + '）の必要' + c.need + 'ptを満たせません。</b>' +
        'この日に出られる人の合計は最大' + c.maxPossible + 'ptです。</span>' +
        (who.length ? '<span>この日の希望休：' + esc(who.join('、')) + '</span>' : '') +
        '<span>直前までの連勤制限も影響しています。この日の希望休を減らす、必要ptを下げる、スタッフを増やすのいずれかで解決します。</span>';
    } else {
      html = '<span><b>条件を満たす表を作れませんでした。</b>スタッフの設定を確認してください。</span>';
    }
    ui.msg = { kind: 'bad', html };
    renderGrid();
  }

  function exportCsv() {
    const D = dayCount();
    const rows = currentRows();
    const head = ['スタッフ'];
    for (let d = 1; d <= D; d++) head.push((ui.month + 1) + '/' + d + '(' + WD[weekday(d)] + ')');
    head.push('出勤日数');
    const lines = [head];
    state.staff.forEach((s, i) => {
      const line = [s.name];
      let cnt = 0;
      for (let d = 0; d < D; d++) {
        if (rows[i][d]) { line.push('出'); cnt++; } else line.push('休');
      }
      line.push(cnt);
      lines.push(line);
    });
    const csv = lines.map((l) => l.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    if (sandboxed) {
      // ダウンロードできない環境では、Excelに貼り付けられるタブ区切りでコピーする
      const tsv = lines.map((l) => l.join('\t')).join('\n');
      const done = () => toast('表をコピーしました。Excelやスプレッドシートに貼り付けられます');
      const fail = () => toast('コピーできませんでした');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, fail);
      else fail();
      return;
    }
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shift-' + monthKey() + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function setMode(mode) {
    ui.mode = mode;
    $('modeOff').classList.toggle('on', mode === 'off');
    $('modeWork').classList.toggle('on', mode === 'work');
    $('modeOff').setAttribute('aria-pressed', String(mode === 'off'));
    $('modeWork').setAttribute('aria-pressed', String(mode === 'work'));
  }

  function shiftMonth(delta) {
    const d = new Date(ui.year, ui.month + delta, 1);
    ui.year = d.getFullYear();
    ui.month = d.getMonth();
    ui.msg = null;
    renderAll();
  }

  /* ---------- イベント ---------- */
  $('grid').addEventListener('click', (e) => {
    const cell = e.target.closest('td.cell');
    if (cell) return toggleCell(+cell.dataset.i, +cell.dataset.d);
    const dayBtn = e.target.closest('.dayBtn');
    if (dayBtn) {
      const d = +dayBtn.dataset.d;
      const m = md();
      const next = isHigh(d) ? 'normal' : 'high';
      const w = weekday(d);
      const isDefault = next === (w === 0 || w === 6 ? 'high' : 'normal');
      if (isDefault) delete m.dayType[d]; else m.dayType[d] = next;
      changed();
    }
  });
  $('grid').addEventListener('change', (e) => {
    const inp = e.target.closest('.needIn');
    if (!inp) return;
    const d = +inp.dataset.d;
    const m = md();
    const v = inp.value === '' ? NaN : Math.max(0, Math.min(99, Math.round(+inp.value)));
    if (isNaN(v) || v === defaultNeed(d)) delete m.needOv[d];
    else m.needOv[d] = v;
    changed();
  });

  $('offRows').addEventListener('change', (e) => {
    const sel = e.target.closest('select');
    if (!sel) return;
    const id = sel.closest('.off-row').dataset.id;
    const old = offDays(id)[+sel.dataset.slot];
    if (old) setOff(id, old, false);
    if (sel.value) setOff(id, +sel.value, true);
    changed();
  });

  $('prevMonth').onclick = () => shiftMonth(-1);
  $('nextMonth').onclick = () => shiftMonth(1);
  $('solveBtn').onclick = solve;
  $('csvBtn').onclick = exportCsv;
  if (sandboxed) {
    $('csvBtn').textContent = '表をコピー';
    $('printBtn').hidden = true;
  }
  $('printBtn').onclick = () => window.print();
  $('modeOff').onclick = () => setMode('off');
  $('modeWork').onclick = () => setMode('work');

  ['needWeekday', 'needHigh'].forEach((id) => {
    $(id).addEventListener('change', (e) => {
      const v = Math.max(0, Math.min(99, Math.round(+e.target.value || 0)));
      state[id] = v;
      e.target.value = v;
      changed();
    });
  });

  $('staffList').addEventListener('change', (e) => {
    const row = e.target.closest('.staff-row');
    if (!row || !row.dataset.id) return;
    const s = state.staff.find((x) => x.id === row.dataset.id);
    const f = e.target.dataset.f;
    if (f === 'points') {
      s.points = Math.max(1, Math.min(9, Math.round(+e.target.value || 1)));
      e.target.value = s.points;
    } else if (f === 'prevStreak') s.prevStreak = +e.target.value;
    else if (f === 'name') s.name = e.target.value.trim() || '名前';
    changed();
  });
  $('staffList').addEventListener('input', (e) => {
    if (e.target.dataset.f !== 'name') return;
    const s = state.staff.find((x) => x.id === e.target.closest('.staff-row').dataset.id);
    s.name = e.target.value;
    save();
    renderGrid();
  });
  $('staffList').addEventListener('click', (e) => {
    const id = e.target.dataset.del;
    if (!id || state.staff.length <= 1) return;
    state.staff = state.staff.filter((s) => s.id !== id);
    Object.values(state.months).forEach((m) => {
      delete m.off[id];
      if (m.shifts) delete m.shifts[id];
    });
    renderSettings();
    changed();
  });
  $('addStaff').onclick = () => {
    if (state.staff.length >= MAX_UI_STAFF) return;
    state.staff.push({ id: uid(), name: 'スタッフ' + (state.staff.length + 1), points: 1, prevStreak: 0 });
    renderSettings();
    changed();
  };
  let resetTimer = null;
  $('resetBtn').onclick = () => {
    const btn = $('resetBtn');
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed');
      btn.textContent = 'もう一度押すと、入力をすべて消します';
      resetTimer = setTimeout(() => {
        btn.classList.remove('armed');
        btn.textContent = 'すべて初期状態に戻す';
      }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    btn.classList.remove('armed');
    btn.textContent = 'すべて初期状態に戻す';
    state = defaults();
    ui.msg = null;
    renderSettings();
    renderAll();
    solve();
  };

  /* ---------- 起動 ---------- */
  renderSettings();
  renderAll();
  if (firstRun) solve();
})();
</script>
</body>
</html>
